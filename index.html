<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { scroll-behavior: smooth; }
  body { font-family: 'FiraGO', 'Noto Serif Georgian', system-ui, sans-serif; margin: 0; background: #FFFFFF; overscroll-behavior-y: none; }

  /* Reduced motion accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  .font-display { font-family: 'Noto Serif Georgian', 'Cormorant Garamond', Georgia, serif; font-weight: 600; letter-spacing: -0.015em; }
  .font-display-lat { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
  .grain { position: relative; }
  .grain::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.02;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes floatBig { 0%, 100% { transform: translateY(0) scale(1.35); } 50% { transform: translateY(-22px) scale(1.35); } }
  @keyframes floatBundle { 0%, 100% { transform: translateY(0) scale(1.15); } 50% { transform: translateY(-14px) scale(1.15); } }
  @keyframes pulseSoft { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-4px); opacity: 0.85; } }
  @keyframes chatGlowPulse {
    0%, 100% { box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4), 0 0 0 0 rgba(229, 5, 113, 0.35); }
    50% { box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4), 0 0 0 14px rgba(229, 5, 113, 0); }
  }
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes revealUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes revealLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes revealRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes revealScale { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  .anim-fadeup { animation: fadeUp 0.6s ease-out both; }
  .anim-pulse-soft { animation: pulseSoft 2s ease-in-out infinite; }
  .anim-chat-glow { animation: chatGlowPulse 2.5s ease-out infinite; }
  .anim-badge-pulse { animation: badgePulse 1.8s ease-in-out infinite; }
  .anim-float { animation: float 4s ease-in-out infinite; }
  .anim-float-big { animation: floatBig 5s ease-in-out infinite; }
  .anim-float-bundle { animation: floatBundle 6s ease-in-out infinite; }

  /* Shoppable catalog — clamp long product names to 2 lines */
  .clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* Shoppable catalog drawer — viewport height that respects mobile browser chrome
     (Safari address bar, iPhone notch, etc.). `dvh` is dynamic viewport unit. */
  .shoppable-drawer {
    height: 100vh;               /* fallback for older browsers */
    height: 100dvh;              /* modern: shrinks when Safari shows chrome */
    max-height: 100vh;
    max-height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* Drawer entrance: slide up from bottom (only on mount, NOT on close — close is instant) */
  @keyframes slideUpDrawer {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .anim-drawer-up {
    animation: slideUpDrawer 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  /* Add-to-cart success pulse — green confirmation flash */
  @keyframes pulseAdd {
    0%   { transform: scale(1);   box-shadow: 0 4px 12px -2px rgba(16,185,129,0.4); }
    50%  { transform: scale(1.15); box-shadow: 0 6px 20px -2px rgba(16,185,129,0.8); }
    100% { transform: scale(1);   box-shadow: 0 4px 12px -2px rgba(16,185,129,0.4); }
  }
  .anim-pulse-add { animation: pulseAdd 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  /* Hide scrollbar on category chips row */
  .scrollbar-thin::-webkit-scrollbar { height: 4px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(15,15,15,0.15); border-radius: 999px; }

  /* Smooth photo rendering — preserves natural product shots */
  img {
    image-rendering: auto;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  /* Scroll-reveal — triggered when 'is-visible' class added by IntersectionObserver */
  .reveal-up, .reveal-left, .reveal-right, .reveal-scale { opacity: 0; will-change: opacity, transform; }
  .reveal-up.is-visible { animation: revealUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-left.is-visible { animation: revealLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-right.is-visible { animation: revealRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-scale.is-visible { animation: revealScale 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .icn { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
  /* 3D tilt for product images — interactive mouse-tracking */
  .product-tilt-3d {
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    transform-style: preserve-3d;
  }
  .product-mockup { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* iOS Safari safe-area bottom padding — prevents content from sitting under translucent toolbar */
  body {
    padding-bottom: env(safe-area-inset-bottom);
  }
</style>

function slugFromName(name, { includeSurname = true } = {}) {
  if (!name || typeof name !== 'string') return '';
  const cleaned = name.trim();
  if (!cleaned) return '';
  const parts = cleaned.split(/\s+/);
  const useParts = includeSurname ? parts : [parts[0]];
  const slug = useParts

    part.toLowerCase().split('').map(c => GEO_TRANSLIT[c] || c).join('')

    .join('-')
    .replace(/[^a-z0-9-]/g, '')   // strip anything that's not [a-z0-9-]

    .replace(/^-+|-+$/g, '');      
  return slug.length >= 3 ? slug : '';
}

async function compressImage(file, maxDimension = 1200, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
    let width = img.width;
    let height = img.height;
    if (width > height && width > maxDimension) {
    height = Math.round((height * maxDimension) / width);
    width = maxDimension;
    } else if (height > maxDimension) {
    width = Math.round((width * maxDimension) / height);
    height = maxDimension;
    }
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, width, height);
    resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function flyToCart(productId) {
  // Prefer the catalog's floating cart when the catalog drawer is open; else the main cart icon
  const cartIcon = document.getElementById('catalog-floating-cart') || document.getElementById('cart-icon');
  if (!cartIcon) return;
  const card = productId ? document.querySelector('[data-pid="' + productId + '"]') : null;
  const sourceImg = card ? card.querySelector('img') : null;
  let startRect;
  if (sourceImg) {
    startRect = sourceImg.getBoundingClientRect();
  } else {
    startRect = { left: window.innerWidth / 2 - 40, top: window.innerHeight / 2 - 40, width: 80, height: 80 };
  }
  const cartRect = cartIcon.getBoundingClientRect();
  const clone = sourceImg ? sourceImg.cloneNode() : document.createElement('div');
  if (!sourceImg) {
    clone.style.background = '#b5164f';
    clone.style.borderRadius = '50%';
  }
  clone.style.position = 'fixed';
  clone.style.left = startRect.left + 'px';
  clone.style.top = startRect.top + 'px';
  clone.style.width = startRect.width + 'px';
  clone.style.height = startRect.height + 'px';
  clone.style.zIndex = '9999';
  clone.style.pointerEvents = 'none';
  clone.style.borderRadius = '12px';
  clone.style.transition = 'all 0.7s cubic-bezier(0.5, -0.4, 0.6, 1.4)';
  clone.style.objectFit = 'cover';
  clone.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
  document.body.appendChild(clone);
  requestAnimationFrame(function() {
    clone.style.left = (cartRect.left + cartRect.width/2 - 12) + 'px';
    clone.style.top = (cartRect.top + cartRect.height/2 - 12) + 'px';
    clone.style.width = '24px';
    clone.style.height = '24px';
    clone.style.opacity = '0';
    clone.style.borderRadius = '50%';
  });
  setTimeout(function() { clone.remove(); }, 750);
  cartIcon.style.transition = 'transform 0.25s cubic-bezier(0.5, 1.5, 0.5, 1)';
  cartIcon.style.transform = 'scale(1.3)';
  setTimeout(function() { cartIcon.style.transform = 'scale(1)'; }, 250);
}

function Login({ onAuthSuccess, initialError, labels = {} }) {
  const L = (key, fallback) => labels[key] || fallback;

  const [countryCode, setCountryCode] = useState('995'); 
  const [otp, setOtp] = useState('');
  const [step, setStep] = useState('phone'); // 'phone' | 'otp'
  const [phoneMask, setPhoneMask] = useState('');
  const [err, setErr] = useState(initialError || '');
  const [loading, setLoading] = useState(false);
  const handleRequestOtp = async () => {
    let localDigits = phone.replace(/[^\d]/g, '');
    while (localDigits.startsWith('0') && localDigits.length > 1) {
    localDigits = localDigits.substring(1);
    }
    if (localDigits.startsWith(countryCode)) {
    localDigits = localDigits.substring(countryCode.length);
    }
    let phoneToSend;
    if (countryCode === '995') {
    if (!/^5\d{8}$/.test(localDigits)) {
    setErr(L('login_phone_format_error_ge', 'საქართველოს ნომერი: 9 ციფრი, იწყება 5-ით (მაგ: 599123456)'));
    return;
    }
    phoneToSend = localDigits;
    } else {
    if (localDigits.length < 6 || localDigits.length > 13) {
    setErr(L('login_phone_format_error_intl', 'ნომერი არასწორი ფორმატია არჩეული ქვეყნისთვის'));
    return;
    }
    phoneToSend = countryCode + localDigits;
    }
    setLoading(true);
    setErr('');
    try {
    const res = await api({ action: 'request_otp', phone: phoneToSend });
    if (res.ok) {
    setPhone(phoneToSend);
    setPhoneMask(res.phoneMask || '****' + phoneToSend.slice(-4));
    setStep('otp');
    } else {
    setErr(res.error || L('welcome_error_failed', 'SMS გაგზავნა ვერ მოხერხდა'));

// TITLE BADGE — Display rep's current MLM title with hierarchy-based styling.
// `size`: 'lg' for public page (prominent), 'sm' for Dashboard (compact).
function TitleBadge({ title, size = 'lg' }) {
  let titleStr = '';
  let percentage = 0;
  if (!title) return null;
  if (typeof title === 'object') {
    titleStr = title.title || '';
    percentage = title.percentage || 0;
  } else {
    titleStr = title; 
  }
  if (!titleStr) return null;
  const meta = TITLE_META[titleStr] || TITLE_DEFAULT;
  const isLarge = size === 'lg';
  const isTopTier = meta.level >= 5;
  return (
    <div
    className={`inline-flex items-center gap-2 rounded-full font-medium tracking-[0.15em] uppercase ${
    isLarge ? 'px-4 py-1.5 text-xs sm:text-sm' : 'px-3 py-1 text-[10px]'
    }`}
    style={{
    background: isTopTier
    ? `linear-gradient(135deg, ${meta.color} 0%, ${meta.accent} 50%, ${meta.color} 100%)`
    : `${meta.color}15`,
    color: isTopTier ? '#FFFFFF' : meta.color,
    border: `1.5px solid ${meta.color}${isTopTier ? '00' : '44'}`,
    boxShadow: isTopTier
    ? `0 4px 14px -2px ${meta.color}66, inset 0 1px 0 ${meta.accent}AA`
    : 'none',
    }}>
    <span className={isLarge ? 'text-base' : 'text-xs'}>{meta.emoji}</span>
    <span>{titleStr}</span>
    {percentage > 0 && (
    <>
    <span className="mx-0.5">•</span>
    <span>{percentage}%</span>
    </>
    )}
    </div>
  );
}

}

  const iconColor = green

  return (

// VIDEO INTRO — embeds rep's video greeting from YouTube/Vimeo/Instagram/TikTok/Facebook
function parseVideoUrl(url) {
  if (!url || typeof url !== 'string') return null;
  const u = url.trim();
  const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (yt) {
    const isShort = /youtube\.com\/shorts/.test(u);
    const tMatch = u.match(/[?&]t=(\d+)/);
    const startParam = tMatch ? `&start=${tMatch[1]}` : '';
    return { type: 'youtube', orientation: isShort ? 'vertical' : 'horizontal',
    embedUrl: `https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1${startParam}` };
  }
  const vm = u.match(/vimeo\.com\/(\d+)/);
  if (vm) return { type: 'vimeo', orientation: 'horizontal',
    embedUrl: `https://player.vimeo.com/video/${vm[1]}` };
  const ig = u.match(/instagram\.com\/(?:p|reel|reels|tv)\/([a-zA-Z0-9_-]+)/);
  if (ig) return { type: 'instagram', orientation: 'vertical',
    embedUrl: `https://www.instagram.com/p/${ig[1]}/embed` };
  const tt = u.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
  if (tt) return { type: 'tiktok', orientation: 'vertical',
    embedUrl: `https://www.tiktok.com/embed/v2/${tt[1]}` };
  if (/(?:facebook\.com\/(?:watch|[^/]+\/videos|video\.php|reel)|fb\.watch)/.test(u)) {
    // Detect if it's a Reel (vertical) vs regular video (horizontal)
    const isFbReel = /facebook\.com\/reel/.test(u);
    return { type: 'facebook', orientation: isFbReel ? 'vertical' : 'horizontal',
    embedUrl: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(u)}&show_text=false&width=560` };
  }
const bunnyMatch = u.match(/iframe\.mediadelivery\.net\/embed\/(\d+)\/([a-f0-9-]+)/i)
  || u.match(/video\.bunnycdn\.com\/play\/(\d+)\/([a-f0-9-]+)/i);
if (bunnyMatch) {
  return {
    type: 'bunny',
    orientation: 'horizontal',
    libraryId: bunnyMatch[1],
    videoId: bunnyMatch[2],
    embedUrl: `https://iframe.mediadelivery.net/embed/${bunnyMatch[1]}/${bunnyMatch[2]}?autoplay=true&loop=false&muted=false&preload=true`,
  };
}
  if (/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u)) return { type: 'direct', orientation: 'vertical', url: u };
  if (/drive\.google\.com|googleusercontent\.com/.test(u)) {
    const idMatch = u.match(/\/d\/([a-zA-Z0-9_-]+)|[?&]id=([a-zA-Z0-9_-]+)/);
    const driveId = idMatch ? (idMatch[1] || idMatch[2]) : null;
    if (driveId) return { type: 'drive', orientation: 'vertical',
    embedUrl: `https://drive.google.com/file/d/${driveId}/preview` };
  }
  return null;
}

if (parsed.type === 'bunny') {

async function fetchTestProducts() {
  try {
    const response = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ action: 'getTestProducts' })
    });
    const data = await response.json();
    if (data.error) {  return []; }
    const grouped = {};
    (data || []).forEach(item => {
    const key = item.name || 'Unknown';
    if (!grouped[key]) { grouped[key] = { id: item.code || key, name: key, price: item.price, image: null, variants: [] }; }
    grouped[key].variants.push({ name: item.variant || 'Default', color: item.hexColor || '#E8A5B4', price: item.price });
    });
    return Object.values(grouped);
  } catch (err) {
    return [];
  }
}

// ════════════════════════════════════════════════════════════════
//  AiAssistant — AI სილამაზის ასისტენტი (Claude-powered)
//  ცალკე მცურავი ჭილაკი. იყენებს api({action:'ai_chat'}) backend-ს.
//  [PRODUCT:id] ნიშანს პროდუქტის ბარათად აქცევს კალათში დამატებით.
// ════════════════════════════════════════════════════════════════
function AiAssistant({ rep, repCode, dynamicProducts = [], cart, labels = {}, onOpenCatalog }) {
  const L = (key, fallback) => labels[key] || fallback;
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([]); // {role, content}
  const [input, setInput] = useState('');
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);

  const repName = rep && rep.name ? rep.name : '';
  const greeting = (repName
    ? repName + L('ai_greeting_suffix', '-ს ციფრული ასისტენტი ვარ.')
    : L('ai_greeting_generic', 'FARMASI-ს ციფრული ასისტენტი ვარ.'))
    + ' ' + L('ai_greeting_help', 'დაგეხმარები კანის, თმის ან მაკიაჟის პროდუქტის შერჩევაში. რა გაწუხებს?');

  // პირველად გახსნისას მისალმება
  useEffect(() => {
    if (open && messages.length === 0) {
      setMessages([{ role: 'assistant', content: greeting }]);
    }
  }, [open]);

  // ავტო-სქროლი ბოლოში
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, sending]);

  const send = async () => {
    const text = input.trim();
    if (!text || sending) return;
    const userMsg = { role: 'user', content: text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput('');
    setSending(true);

    try {
      // history-ს ბოლო 6 მესიჯი (JSONP URL ლიმიტისთვის)
      const history = newMessages.slice(-6).map(m => ({ role: m.role, content: m.content }));
      const res = await api({ action: 'ai_chat', repPid: repCode || '', message: text,
        history: JSON.stringify(history.slice(0, -1)) });
      if (res && res.ok && res.reply) {
        setMessages(m => [...m, { role: 'assistant', content: res.reply }]);
      } else {
        setMessages(m => [...m, { role: 'assistant',
          content: (res && res.reply) || L('ai_error', 'ბოდიში, შეცდომა მოხდა. სცადე ხელახლა.') }]);
      }
    } catch (e) {
      setMessages(m => [...m, { role: 'assistant',
        content: L('ai_error_network', 'კავშირი ვერ შედგა. სცადე ხელახლა.') }]);
    } finally {
      setSending(false);
    }
  };

  // [PRODUCT:id] ნიშნების პოვნა და პროდუქტის ბარათად ქცევა
  const renderAssistantMessage = (content) => {
    const parts = [];
    const regex = /\[(PRODUCT|SEARCH):([^\]]+)\]/g;
    let lastIndex = 0;
    let match;
    let key = 0;
    while ((match = regex.exec(content)) !== null) {
      // ტექსტი ნიშნამდე
      if (match.index > lastIndex) {
        const txt = content.slice(lastIndex, match.index).trim();
        if (txt) parts.push(<p key={'t' + key} className="text-sm leading-relaxed whitespace-pre-wrap" style={{ color: theme.ink }}>{txt}</p>);
      }
      const tagType = match[1];
      const tagValue = match[2].trim();
      // [SEARCH:term] — კატალოგში გადამისამართების ღილაკი
      if (tagType === 'SEARCH') {
        parts.push(
          <button key={'s' + key} onClick={() => { if (onOpenCatalog) onOpenCatalog(tagValue); setOpen(false); }}
            className="w-full flex items-center justify-center gap-2 my-2 py-3 rounded-xl text-sm font-medium transition hover:scale-[1.02] active:scale-95"
            style={{ background: `linear-gradient(135deg, ${theme.wine}, ${theme.rose})`, color: theme.cream }}>
            <Ic name="grid" className="w-4 h-4" />
            {L('ai_see_all_in_catalog', 'ნახე ყველა')} "{tagValue}" {L('ai_in_catalog', 'კატალოგში')}
          </button>
        );
        lastIndex = regex.lastIndex;
        key++;
        continue;
      }
      // [PRODUCT:id] — პროდუქტის ბარათი
      const pid = tagValue;
      const product = dynamicProducts.find(p =>
        String(p.id) === pid || String(p.product_id) === pid || String(p.code) === pid);
      if (product) {
        parts.push(
          <div key={'p' + key} className="flex items-center gap-3 p-2.5 my-2 rounded-xl" style={{ background: theme.ivory, border: `1px solid ${theme.gold}22` }}>
            {product.image
              ? <img src={product.image} alt="" className="w-12 h-12 rounded-lg object-cover flex-shrink-0" style={{ border: `1px solid ${theme.gold}33` }} />
              : <div className="w-12 h-12 rounded-lg flex-shrink-0 flex items-center justify-center" style={{ background: theme.mist }}><Ic name="image" className="w-5 h-5" style={{ color: theme.gold }} /></div>}
            <div className="min-w-0 flex-1">
              <p className="text-xs font-medium truncate" style={{ color: theme.ink }}>{product.name}</p>
              <p className="text-xs" style={{ color: theme.wine }}>{product.price} ₾</p>
            </div>
            {cart && cart.addItem && (
              <button onClick={() => {
                cart.addItem({ product_id: product.id, name: product.name, price: product.price, image: product.image, quantity: 1 });
                if (cart.setOpen) setTimeout(() => cart.setOpen(true), 200);
              }}
                className="flex-shrink-0 w-9 h-9 rounded-full flex items-center justify-center transition hover:scale-110 active:scale-95"
                style={{ background: theme.wine, color: theme.cream }}
                aria-label={L('ai_add_to_cart', 'კალათში')}>
                <Ic name="plus" className="w-4 h-4" />
              </button>
            )}
          </div>
        );
      }
      lastIndex = regex.lastIndex;
      key++;
    }
    // დარჩენილი ტექსტი
    if (lastIndex < content.length) {
      const txt = content.slice(lastIndex).trim();
      if (txt) parts.push(<p key={'t' + key} className="text-sm leading-relaxed whitespace-pre-wrap" style={{ color: theme.ink }}>{txt}</p>);
    }
    return parts.length ? parts : <p className="text-sm leading-relaxed whitespace-pre-wrap" style={{ color: theme.ink }}>{content}</p>;
  };

  return (
    <>
      {/* მცურავი ღილაკი — ცენტრ-მარცხნივ, კონსულტაციის ღილაკის ზემოთ */}
      {!open && (
        <button onClick={() => setOpen(true)}
          className="fixed bottom-[6.5rem] left-5 z-40 flex items-center gap-2 pl-2 pr-4 py-2 rounded-full transition hover:scale-105 active:scale-95 shadow-2xl"
          style={{ background: `linear-gradient(135deg, ${theme.wine}, ${theme.rose})`, color: theme.cream }}
          aria-label={L('ai_button_label', 'AI ასისტენტი')}>
          {rep && rep.photo
            ? <img src={rep.photo} alt="" className="w-7 h-7 rounded-full object-cover" style={{ border: '1.5px solid rgba(255,255,255,0.6)' }} />
            : <span className="w-7 h-7 rounded-full flex items-center justify-center" style={{ background: 'rgba(255,255,255,0.25)' }}>✨</span>}
          <span className="text-sm font-medium tracking-wide">{L('ai_button_label', 'AI ასისტენტი')}</span>
        </button>
      )}

      {/* ჩატის ფანჯარა */}
      {open && (
        <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center sm:p-4" style={{ background: 'rgba(15,15,15,0.45)', backdropFilter: 'blur(4px)' }}
          onClick={(e) => { if (e.target === e.currentTarget) setOpen(false); }}>
          <div className="w-full sm:max-w-md flex flex-col rounded-t-3xl sm:rounded-3xl overflow-hidden anim-drawer-up"
            style={{ background: theme.cream, boxShadow: '0 -10px 50px -10px rgba(0,0,0,0.3)', height: '85vh', maxHeight: '640px' }}>

            {/* Header */}
            <div className="flex-shrink-0 px-5 py-4 flex items-center justify-between" style={{ background: `linear-gradient(135deg, ${theme.wine}, ${theme.rose})` }}>
              <div className="flex items-center gap-3">
                {rep && rep.photo
                  ? <img src={rep.photo} alt="" className="w-10 h-10 rounded-full object-cover" style={{ border: '2px solid rgba(255,255,255,0.6)' }} />
                  : <span className="w-10 h-10 rounded-full flex items-center justify-center text-lg" style={{ background: 'rgba(255,255,255,0.25)' }}>✨</span>}
                <div>
                  <p className="text-sm font-semibold" style={{ color: theme.cream }}>{L('ai_header_title', 'AI სილამაზის ასისტენტი')}</p>
                  <p className="text-[11px]" style={{ color: 'rgba(255,255,255,0.85)' }}>{repName || 'FARMASI'}</p>
                </div>
              </div>
              <button onClick={() => setOpen(false)} className="w-9 h-9 rounded-full flex items-center justify-center transition hover:scale-110" style={{ background: 'rgba(255,255,255,0.2)', color: theme.cream }}>
                <Ic name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* მესიჯები */}
            <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3">
              {messages.map((m, i) => (
                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[85%] px-3.5 py-2.5 rounded-2xl ${m.role === 'user' ? 'rounded-br-md' : 'rounded-bl-md'}`}
                    style={m.role === 'user'
                      ? { background: theme.wine, color: theme.cream }
                      : { background: theme.ivory, border: `1px solid ${theme.gold}22` }}>
                    {m.role === 'user'
                      ? <p className="text-sm leading-relaxed whitespace-pre-wrap">{m.content}</p>
                      : renderAssistantMessage(m.content)}
                  </div>
                </div>
              ))}
              {sending && (
                <div className="flex justify-start">
                  <div className="px-4 py-3 rounded-2xl rounded-bl-md" style={{ background: theme.ivory, border: `1px solid ${theme.gold}22` }}>
                    <div className="flex gap-1">
                      <span className="w-2 h-2 rounded-full anim-pulse-soft" style={{ background: theme.wine, animationDelay: '0ms' }} />
                      <span className="w-2 h-2 rounded-full anim-pulse-soft" style={{ background: theme.wine, animationDelay: '150ms' }} />
                      <span className="w-2 h-2 rounded-full anim-pulse-soft" style={{ background: theme.wine, animationDelay: '300ms' }} />
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* შეტანის ველი */}
            <div className="flex-shrink-0 w-full px-3 py-3 border-t" style={{ borderColor: theme.gold + '22', background: theme.cream, paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom, 0px))', boxSizing: 'border-box' }}>
              <div className="flex gap-2 items-end w-full">
                <textarea value={input} onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
                  rows={1} placeholder={L('ai_input_placeholder', 'დაწერე შენი კითხვა...')}
                  className="flex-1 min-w-0 px-4 py-3 text-sm rounded-2xl outline-none resize-none max-h-32"
                  style={{ background: theme.ivory, border: `1.5px solid ${theme.gold}33`, color: theme.ink }} />
                <button onClick={send} disabled={!input.trim() || sending}
                  className="flex-shrink-0 w-12 h-12 rounded-full flex items-center justify-center transition hover:scale-105 active:scale-95"
                  style={input.trim() && !sending
                    ? { background: theme.wine, color: theme.cream }
                    : { background: theme.ink + '22', color: theme.ink + '55', cursor: 'not-allowed' }}>
                  <Ic name="send" className="w-5 h-5" />
                </button>
              </div>
              <p className="text-[10px] text-center mt-2" style={{ color: theme.ink + '66' }}>
                {L('ai_disclaimer', 'AI რჩევაა — სერიოზულ პრობლემაზე ექიმს მიმართე')}
              </p>
            </div>
          </div>
        </div>
      )}
    </>
  );
}


function ChatModal({ rep, onClose, product, t = (k, fb) => fb }) {
  const [msg, setMsg] = useState(product
    ? `${t('chat_product_intro_prefix', 'გამარჯობა, "')}${product.name}${t('chat_product_intro_suffix', '"-ს შესახებ მაინტერესებს...')}`
    : '');
  const [toast, setToast] = useState(null);
  const extractUsername = (val, domain) => {
    if (!val) return '';
    let v = val.replace('@', '').trim();
    if (v.startsWith('http')) {
    try {
    const u = new URL(v);
    v = u.pathname.split('/').filter(Boolean)[0] || '';
    } catch {}
    }
    return v;
  };
  const channels = [];
  if (rep.whatsapp) {
    channels.push({
    type: 'whatsapp',
    label: 'WhatsApp',
    color: '#25D366',
    autoFill: true,
    primary: true,
    build: (m) => `https://wa.me/${rep.whatsapp.replace(/[^\d]/g,'')}?text=${encodeURIComponent(m)}`
    });
  }
  if (rep.telegram) {
    const tgUser = extractUsername(rep.telegram);
    channels.push({
    type: 'telegram',
    label: 'Telegram',
    color: '#0088CC',
    autoFill: false, // browsers don't pre-fill DMs
    build: () => `https://t.me/${tgUser}`
    });
  }
  if (rep.facebook) {
    const fbUser = extractUsername(rep.facebook);
    channels.push({
    type: 'facebook',
    label: 'Messenger',
    color: '#0084FF',
    autoFill: false,
    build: () => `https://m.me/${fbUser}`
    });
  }
  if (rep.instagram) {
    const igUser = extractUsername(rep.instagram);
    channels.push({
    type: 'instagram',
    label: 'Instagram',
    color: '#E4405F',
    autoFill: false,
    build: () => `https://instagram.com/${igUser}`
    });
  }
  if (rep.tiktok) {
    let ttUser = extractUsername(rep.tiktok);
    if (!ttUser.startsWith('@')) ttUser = '@' + ttUser;
    channels.push({
    type: 'tiktok',
    label: 'TikTok',
    color: '#000000',
    autoFill: false,
    build: () => `https://tiktok.com/${ttUser}`
    });
  }
  const primary = channels.find(c => c.primary);
  const secondary = channels.filter(c => !c.primary);
  const showToast = (text, isError = false) => {
    setToast({ text, isError });
    setTimeout(() => setToast(null), 4000);
  };
  const sendVia = async (channel) => {
    if (!msg.trim()) {
    showToast(t('chat_toast_empty', '⚠️ ჯერ ჩაწერე მესიჯი'), true);
    return;
    }
    const url = channel.build(msg);
    if (!channel.autoFill) {
    try {
    await navigator.clipboard.writeText(msg);
    showToast(t('chat_toast_copied', '✓ მესიჯი დაკოპირდა — ჩატში დააჭირე Ctrl+V (ან long-press → Paste)'));
    } catch (err) {
    showToast(t('chat_toast_copy_failed', '⚠️ ხელით დააკოპირე ტექსტი და ჩასვი ჩატში'), true);
    }
    }
    window.open(url, '_blank', 'noopener,noreferrer');
  };
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center px-0 sm:px-5 py-0 sm:py-10"
    style={{ background: 'rgba(35,23,18,0.6)', backdropFilter: 'blur(8px)' }} onClick={onClose}>
    <div className="w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 anim-fadeup relative"
    style={{ background: theme.ivory }} onClick={(e) => e.stopPropagation()}>
    {}
    <div className="flex items-center justify-between mb-5">
    <div>
    <p className="text-xs tracking-widest uppercase" style={{ color: theme.gold }}>{t('chat_header_eyebrow', 'მომწერე')}</p>
    <p className="font-display text-xl" style={{ color: theme.ink }}>{rep.name}</p>
    </div>
    <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center"
    style={{ background: theme.cream, color: theme.ink }}>
    <Ic name="x" className="w-4 h-4" />
    </button>
    </div>
    {}
    <textarea value={msg} onChange={(e) => setMsg(e.target.value)} rows={4}
    placeholder={t('chat_msg_placeholder', 'გამარჯობა! მაინტერესებს...')}
    className="w-full p-3 rounded-xl outline-none text-sm resize-none"
    style={{ background: theme.cream, border: `1.5px solid ${theme.gold}33`, color: theme.ink }} />
    {}
    {primary && (
    <button onClick={() => sendVia(primary)}
    className="w-full mt-4 py-3.5 rounded-xl flex items-center justify-center gap-2 text-sm font-medium transition hover:scale-[1.01]"
    style={{ background: primary.color, color: '#fff', boxShadow: `0 10px 25px -10px ${primary.color}99` }}>
    <SocialIcon name="whatsapp" className="w-4 h-4" />
    {primary.label}{t('chat_send_via_suffix', '-ზე გაგზავნა')}
    <span className="text-[10px] opacity-80 ml-1">{t('chat_autofill_hint', '✨ პირდაპირ ჩავარდება')}</span>
    </button>
    )}
    {}
    {secondary.length > 0 && (
    <>
    <div className="flex items-center gap-3 mt-5 mb-3">
    <div className="flex-1 h-px" style={{ background: theme.ink + '22' }} />
    <p className="text-[9px] tracking-[0.3em] uppercase" style={{ color: theme.ink + '77' }}>
    {t('chat_other_channels', 'ან აირჩიე სხვა არხი')}
    </p>
    <div className="flex-1 h-px" style={{ background: theme.ink + '22' }} />
    </div>
    <div className={`grid gap-2 ${secondary.length === 1 ? 'grid-cols-1' : secondary.length === 2 ? 'grid-cols-2' : 'grid-cols-2 sm:grid-cols-' + Math.min(secondary.length, 4)}`}>
    {secondary.map((ch) => (
    <button key={ch.type} onClick={() => sendVia(ch)}
    className="py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 text-xs font-medium transition hover:scale-[1.02]"
    style={{
    background: '#fff',
    color: ch.color,
    border: `1.5px solid ${ch.color}33`
    }}>
    <SocialIcon name={ch.type} className="w-4 h-4" />
    {ch.label}
    </button>
    ))}
    </div>
    <p className="text-[10px] mt-2.5 text-center" style={{ color: theme.ink + '66' }}>
    {t('chat_copy_hint', '↑ ტექსტი ავტომატურად დაკოპირდება — ჩასვი ჩატში')}
    </p>
    </>
    )}
    {}
    {rep.phone && (
    <p className="text-[10px] mt-4 text-center" style={{ color: theme.ink + '77' }}>
    {t('chat_phone_lead', 'ან დარეკე:')} <a href={`tel:${rep.phone}`} className="underline font-medium" style={{ color: theme.wine }}>{rep.phone}</a>
    </p>
    )}
    {}
    {toast && (
    <div className="absolute left-1/2 -translate-x-1/2 -bottom-16 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium max-w-[90%] text-center anim-fadeup"
    style={{
    background: toast.isError ? '#DC2626' : theme.ink,
    color: '#fff',
    boxShadow: '0 20px 50px -15px rgba(0,0,0,0.5)'
    }}>
    {toast.text}
    </div>
    )}
    </div>
    </div>
  );
}

<script id="codex-wheel-scroll-fix">
  (function () {
    window.addEventListener('wheel', function (event) {
      if (!event || !event.deltaY) return;

      var startY = window.scrollY || document.documentElement.scrollTop || 0;
      var activeModal = document.querySelector('[role="dialog"], dialog[open], .modal.show, .fixed.top-0.right-0.bottom-0');

      window.setTimeout(function () {
        var currentY = window.scrollY || document.documentElement.scrollTop || 0;
        var pageCanScroll = document.documentElement.scrollHeight > window.innerHeight + 2;

        if (!pageCanScroll || Math.abs(currentY - startY) > 1) return;

        var scrollAmount = event.deltaY * 6;

        if (activeModal && activeModal.contains(event.target)) {
          activeModal.scrollTop += scrollAmount;
          return;
        }

        window.scrollBy({
          top: scrollAmount,
          left: 0,
          behavior: 'auto'
        });
      }, 0);
    }, { capture: true, passive: true });
  })();
</script>
