<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Farmasi გათამაშება · Masterclass 2026</title>
  <meta name="theme-color" content="#0a0506" />
  <link rel="icon" type="image/png" href="farmasi.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    :root{
      --bg:#0a0506;--card:#1b0f13;--card2:#261319;--pink:#ff6075;--pink2:#e64a61;
      --gold:#e8c468;--gold2:#f7dfa0;--cream:#f7efe6;--dim:#b9a99b;--line:rgba(232,196,104,.24);
      --font:'Noto Sans Georgian',sans-serif;--display:'Cormorant Garamond','Noto Sans Georgian',serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:
      radial-gradient(ellipse at 50% 0%,rgba(232,196,104,.12),transparent 50%),
      radial-gradient(ellipse at 50% 100%,rgba(255,96,117,.12),transparent 55%),
      linear-gradient(180deg,#070304,#14080c 55%,#070304);color:var(--cream);font-family:var(--font);overflow-x:hidden;padding:18px 12px 40px}
    .wrap{max-width:520px;margin:0 auto;position:relative;z-index:2}.header{text-align:center;margin:8px 0 18px}
    .logo{width:132px;max-height:62px;object-fit:contain;filter:drop-shadow(0 0 18px rgba(232,196,104,.35));margin-bottom:10px}
    .badge{display:inline-flex;gap:8px;align-items:center;padding:7px 16px;border-radius:999px;background:rgba(255,96,117,.12);border:1px solid rgba(255,96,117,.4);color:var(--pink);font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    h1{font-family:var(--display);font-size:42px;line-height:1;margin:12px 0 6px;font-weight:600}.accent{font-style:italic;color:var(--gold2)}
    .sub{color:var(--dim);font-size:11px;letter-spacing:1.3px;text-transform:uppercase}.card{background:linear-gradient(180deg,rgba(38,19,25,.92),rgba(18,8,11,.92));border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 22px 70px rgba(0,0,0,.55);backdrop-filter:blur(20px);margin-bottom:12px;position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;top:-1px;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);filter:blur(.5px)}
    .controls{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.group label{display:block;color:var(--gold);font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin:0 0 5px 4px}
    input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--cream);font-family:var(--font);font-size:13px;outline:none}option{background:#1b0f13}.btn{width:100%;border:0;border-radius:14px;padding:13px 16px;font-family:var(--font);font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.btn-primary{background:linear-gradient(135deg,var(--pink),#ff7f90,var(--pink2));color:white;box-shadow:0 10px 28px rgba(255,96,117,.38)}.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#23100f}.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--gold2)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.disabled-hard{opacity:.45;filter:grayscale(.2)}.btn:hover:not(:disabled){transform:translateY(-1px)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{text-align:center;background:rgba(0,0,0,.28);border:1px solid rgba(232,196,104,.14);border-radius:14px;padding:10px 6px}.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--gold2);line-height:1}.stat span{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
    .machine{padding:18px 14px 22px}.slot{height:276px;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#12070a,#250f16 48%,#12070a);border:1px solid rgba(232,196,104,.34);box-shadow:inset 0 0 42px rgba(0,0,0,.6),0 0 50px rgba(232,196,104,.08)}
    .slot:before,.slot:after{content:"";position:absolute;left:0;right:0;height:42%;z-index:4;pointer-events:none}.slot:before{top:0;background:linear-gradient(180deg,rgba(10,5,6,.98),rgba(10,5,6,.72),transparent)}.slot:after{bottom:0;background:linear-gradient(0deg,rgba(10,5,6,.98),rgba(10,5,6,.72),transparent)}
    .win-line{position:absolute;left:10px;right:10px;top:50%;height:72px;transform:translateY(-50%);border-top:2px solid rgba(232,196,104,.85);border-bottom:2px solid rgba(232,196,104,.85);border-radius:16px;background:linear-gradient(90deg,transparent,rgba(232,196,104,.12),transparent);box-shadow:0 0 28px rgba(232,196,104,.26);z-index:3;pointer-events:none}.win-line:before,.win-line:after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);color:var(--gold2);text-shadow:0 0 10px rgba(232,196,104,.8)}.win-line:before{left:10px}.win-line:after{right:10px}
    .reel{position:absolute;left:0;right:0;top:0;will-change:transform}.reel-item{height:72px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 46px;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.3px;color:rgba(247,239,230,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reel-item .ticket{display:block;font-family:var(--font);font-size:9px;letter-spacing:1.3px;color:rgba(232,196,104,.7);margin-top:2px}.reel-item.active{color:var(--gold2);text-shadow:0 0 18px rgba(232,196,104,.55);font-size:30px}
    .winner{display:none;text-align:center;padding:16px 10px}.winner.show{display:block;animation:pop .55s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}.winner small{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:10px;font-weight:800}.winner h2{font-family:var(--display);font-size:34px;line-height:1.05;margin:8px 0 4px}.winner p{margin:0;color:var(--dim);font-size:12px}.message{display:none;margin-top:10px;padding:10px;border-radius:12px;text-align:center;font-size:12px}.message.show{display:block}.message.err{background:rgba(255,96,117,.12);border:1px solid rgba(255,96,117,.3);color:#ff96a5}.message.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#73e49c}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.history{max-height:220px;overflow:auto}.history-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(232,196,104,.1);font-size:12px}.history-item b{color:var(--cream)}.history-item span{color:var(--gold);text-align:right}.hide{display:none!important}@media(max-width:420px){h1{font-size:36px}.row{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.reel-item{font-size:22px;padding:0 34px}.reel-item.active{font-size:25px}.slot{height:260px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="farmasi.png" class="logo" alt="Farmasi" onerror="this.style.display='none'">
      <div class="badge">✦ Raffle Draw ✦</div>
      <h1>Farmasi <span class="accent">გათამაშება</span></h1>
      <div class="sub">სახელები ტრიალებს და გამარჯვებული ფიქსირდება შუა ხაზზე</div>
    </div>

    <div class="card controls">
      <div class="row">
        <div class="group"><label for="pin">Admin PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN" /></div>
        <div class="group"><label for="checkedOnly">მონაწილეები</label><select id="checkedOnly"><option value="1">მხოლოდ Check-in გავლილი</option><option value="0">ყველა რეგისტრირებული</option></select></div>
      </div>
      <button class="btn btn-ghost" id="loadBtn">მონაწილეების ჩატვირთვა</button>
      <div class="row">
        <div class="group"><label for="prizeSelect">პრიზი</label><select id="prizeSelect"><option value="">აირჩიე პრიზი ან ჩაწერე ხელით</option></select></div>
        <div class="group"><label for="manualPrize">ხელით ჩაწერა</label><input id="manualPrize" type="text" placeholder="მაგ: სუნამო" /></div>
      </div>
      <div class="stats"><div class="stat"><b id="totalCount">0</b><span>მონაწილე</span></div><div class="stat"><b id="winCount">0</b><span>არჩეული</span></div><div class="stat"><b id="leftCount">0</b><span>დარჩა</span></div></div>
      <div class="message" id="msg"></div>
    </div>

    <div class="card machine">
      <div class="slot" id="slot"><div class="win-line"></div><div class="reel" id="reel"></div></div>
      <div class="winner" id="winnerBox"><small>გამარჯვებული</small><h2 id="winnerName">—</h2><p id="winnerInfo">—</p></div>
      <div class="actions"><button class="btn btn-primary" id="spinBtn" disabled>დატრიალება</button><button class="btn btn-ghost" id="clearScreenBtn" type="button">გასუფთავება</button></div>
    </div>

    <div class="card history"><div class="group"><label>გამარჯვებულები ამ სესიაში</label></div><div id="historyList"></div></div>
  </div>

  <script>
    'use strict';
    const API_URL = "https://script.google.com/macros/s/AKfycbz40UE4b9og1Yjs0rPPfDe1H-yRi90hKbK2WOXej4CAWPCnncDFcetadMEdQSYJO7nf/exec";
    const ITEM_H = 72;
    const VISIBLE_CENTER_OFFSET = 102; // (276 - 72)/2
    let participants = [], available = [], prizes = [], currentWinner = null, spinning = false;
    const winners = JSON.parse(sessionStorage.getItem('raffle_winners_v1') || '[]');
    const wonKeys = new Set(JSON.parse(sessionStorage.getItem('raffle_won_keys_v1') || '[]'));
    const $ = id => document.getElementById(id);

    // 5-წამიანი მოგების მუსიკა — რბილი fanfare / jackpot სტილი.
    let audioCtx = null;
    function playVictoryMusic(){
      try{
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if(audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.16, now + 0.10);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 5.15);
        master.connect(audioCtx.destination);

        function note(freq, start, dur, type='triangle', vol=0.45){
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(vol, start + 0.035);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
          osc.connect(gain);
          gain.connect(master);
          osc.start(start);
          osc.stop(start + dur + 0.05);
        }

        // Lower, warmer victory melody, not a sharp beep.
        [
          [392,.00,.42],[493.88,.26,.42],[587.33,.52,.48],
          [783.99,.95,.62],[739.99,1.45,.34],[783.99,1.72,.62],
          [587.33,2.25,.42],[659.25,2.52,.42],[783.99,2.80,.55],
          [987.77,3.22,.74],[880.00,3.82,.38],[987.77,4.10,.92]
        ].forEach((n,i)=>note(n[0], now+n[1], n[2], i>7?'sine':'triangle', 0.50));

        // Soft bass body
        [[98,.00,1.20],[146.83,.85,1.15],[196,1.70,1.20],[246.94,2.60,1.25],[293.66,3.55,1.40]]
          .forEach(n=>{ note(n[0], now+n[1], n[2], 'sine', 0.22); note(n[0]*2, now+n[1]+0.03, n[2]*0.85, 'sine', 0.10); });

        // Gentle sparkle
        [0.35,0.85,1.35,2.05,2.75,3.35,4.05,4.65]
          .forEach((t,i)=>note(1174.66 + (i%2)*293.66, now+t, 0.18, 'sine', 0.10));
      }catch(e){
        console.warn('Victory music blocked/unavailable:', e);
      }
    }

    function msg(text, type='ok') { const el=$('msg'); el.textContent=text; el.className='message show ' + (type==='err'?'err':'ok'); }
    function clearMsg(){ $('msg').className='message'; $('msg').textContent=''; }
    function nameOf(p){ return [p.first_name,p.last_name].filter(Boolean).join(' ').trim() || p.ticket_id || 'მონაწილე'; }
    function prizeName(){ return ($('manualPrize').value || $('prizeSelect').value || '').trim(); }
    function selectedPrizeOrWarn(){
      const p = prizeName();
      if(!p){
        msg('ჯერ აირჩიე პრიზი ან ხელით ჩაწერე პრიზის სახელი.', 'err');
        return '';
      }
      return p;
    }
    function updateStats(){ $('totalCount').textContent=participants.length; $('winCount').textContent=winners.length; $('leftCount').textContent=available.length; }

    function api(params){ const url = API_URL + '?' + new URLSearchParams(params).toString(); return fetch(url).then(r=>r.json()); }

    function uniqueByKey(list){
      const seen = new Set();
      return (list || []).filter(p=>{
        const k = p.ticket_id || p.phone || nameOf(p);
        if(seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    function renderPrizes(){ const sel=$('prizeSelect'); sel.innerHTML='<option value="">აირჩიე პრიზი ან ჩაწერე ხელით</option>'; prizes.forEach(p=>{ const o=document.createElement('option'); o.value=p.name; o.textContent=p.name; sel.appendChild(o); }); }

    function renderReel(list, activeTicket){
      const reel=$('reel'); reel.innerHTML='';
      list.forEach(p=>{
        const div=document.createElement('div'); div.className='reel-item' + (activeTicket && p.ticket_id===activeTicket?' active':'');
        div.innerHTML = '<div>' + escapeHtml(nameOf(p)) + '<span class="ticket">' + escapeHtml(p.ticket_id || p.phone || '') + '</span></div>';
        reel.appendChild(div);
      });
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    function buildSpinList(winner){
      const winnerKey = winner.ticket_id || winner.phone;
      const base = (available.length ? available : participants)
        .filter(p => (p.ticket_id || p.phone) !== winnerKey);

      // Shuffle without duplicating people in the visible reel.
      const shuffled = base.slice().sort(() => Math.random() - 0.5);
      const beforeCount = Math.min(shuffled.length, 28);
      const before = shuffled.slice(0, beforeCount);

      // Winner is included only once, at the final stop position.
      return before.concat([winner]);
    }

    async function loadAll(){
      clearMsg(); $('loadBtn').disabled=true; $('loadBtn').textContent='იტვირთება...';
      try{
        const pin=$('pin').value.trim();
        const [pool, prizeRes] = await Promise.all([
          api({action:'get_raffle_pool', pin, checked_only:$('checkedOnly').value}),
          api({action:'get_raffle_prizes', pin})
        ]);
        if(!pool.ok) throw new Error(pool.error || 'მონაწილეები ვერ ჩაიტვირთა');
        participants = (pool.participants || []).filter(p=>p.ticket_id || p.phone);
        available = participants.filter(p=>!wonKeys.has(p.ticket_id || p.phone));
        prizes = prizeRes && prizeRes.ok ? (prizeRes.prizes || []) : [];
        renderPrizes(); renderReel(uniqueByKey(available).slice(0, 20)); updateStats(); renderHistory();
        $('spinBtn').disabled = available.length < 1;
        msg('ჩაიტვირთა: ' + participants.length + ' მონაწილე');
      }catch(e){ msg(e.message || String(e),'err'); }
      finally{ $('loadBtn').disabled=false; $('loadBtn').textContent='მონაწილეების ჩატვირთვა'; }
    }

    function spin(){
      if(spinning || !available.length) return;
      const pickedPrize = selectedPrizeOrWarn();
      if(!pickedPrize) return;
      clearMsg(); spinning=true; currentWinner=null; $('winnerBox').classList.remove('show');
      const idx = Math.floor(Math.random()*available.length);
      const winner = available[idx];
      const spinList = buildSpinList(winner);
      renderReel(spinList);
      const reel=$('reel'); reel.style.transition='none'; reel.style.transform='translateY(0px)'; reel.offsetHeight;
      const winnerIndex = spinList.length - 1;
      const targetY = -(winnerIndex * ITEM_H) + VISIBLE_CENTER_OFFSET;
      reel.style.transition='transform 5.6s cubic-bezier(.08,.78,.08,1)';
      reel.style.transform='translateY(' + targetY + 'px)';
      setTimeout(()=>{
        spinning=false; currentWinner=winner; renderReel(spinList, winner.ticket_id); reel.style.transition='none'; reel.style.transform='translateY(' + targetY + 'px)';
        $('winnerName').textContent=nameOf(winner); $('winnerInfo').textContent=(winner.ticket_id||'') + ' · ' + (winner.city||'') + ' · ' + pickedPrize; $('winnerBox').classList.add('show');
        playVictoryMusic();
        announceWinnerAuto(winner, pickedPrize);
        const winnerKey = winner.ticket_id || winner.phone;
        wonKeys.add(winnerKey);
        sessionStorage.setItem('raffle_won_keys_v1', JSON.stringify(Array.from(wonKeys)));
        available = available.filter(p=>(p.ticket_id||p.phone)!==winnerKey);
        winners.push({ticket_id:winner.ticket_id, phone:winner.phone, name:nameOf(winner), prize:pickedPrize, time:new Date().toISOString()});
        sessionStorage.setItem('raffle_winners_v1', JSON.stringify(winners)); updateStats(); renderHistory();
        if(window.confetti){ confetti({particleCount:160,spread:75,origin:{y:.62}}); setTimeout(()=>confetti({particleCount:90,spread:110,origin:{y:.5}}),350); }
      }, 5750);
    }

    async function announceWinnerAuto(winner, pickedPrize){
      if(!winner) return;
      try{
        msg('გამარჯვებული დაფიქსირდა — SMS ავტომატურად იგზავნება...', 'ok');
        const res = await api({
          action:'announce_raffle_winner',
          pin:$('pin').value.trim(),
          checked_only:$('checkedOnly').value,
          ticket_id:winner.ticket_id,
          phone:winner.phone,
          prize_name:pickedPrize
        });
        if(!res.ok) throw new Error(res.error || 'SMS ავტომატურად ვერ გაიგზავნა');
        msg('SMS ავტომატურად დასრულდა · მონაწილეები: ' + (res.participant_sent || res.sent || 0) + ' · ადმინები: ' + (res.admin_sent || 0) + ((res.errors && res.errors.length) ? ' · შეცდომა: ' + res.errors.length : ''));
      }catch(e){
        msg('გამარჯვებული გამოვლინდა, მაგრამ SMS-ზე შეცდომაა: ' + (e.message || String(e)), 'err');
      }
    }

    function syncPrizeInputs(source){
      if(source === 'manual' && $('manualPrize').value.trim()){
        $('prizeSelect').value = '';
      }
      if(source === 'select' && $('prizeSelect').value.trim()){
        $('manualPrize').value = '';
      }
    }

    function clearScreen(){
      // სრული გასუფთავება / ახალი გათამაშება:
      // იშლება ვიზუალური ისტორიაც და შიდა დაბლოკილი გამარჯვებულების სიაც.
      if(spinning) return;
      currentWinner = null;

      winners.length = 0;
      wonKeys.clear();
      sessionStorage.removeItem('raffle_winners_v1');
      sessionStorage.removeItem('raffle_won_keys_v1');

      available = uniqueByKey(participants);
      $('winnerBox').classList.remove('show');
      $('winnerName').textContent = '—';
      $('winnerInfo').textContent = '—';
      clearMsg();

      renderHistory();
      renderReel(available.length ? available.slice(0, 20) : [{first_name:'მონაწილეები',last_name:'იტრიალებს',ticket_id:'FARMASI 2026'}]);

      const reel = $('reel');
      reel.style.transition = 'none';
      reel.style.transform = 'translateY(0px)';

      $('spinBtn').disabled = available.length < 1;
      updateStats();
      msg('გათამაშება გასუფთავდა. ყველა მონაწილე თავიდან დაემატა.');
    }

    function renderHistory(){ const box=$('historyList'); if(!winners.length){box.innerHTML='<div style="color:var(--dim);font-size:12px;text-align:center;padding:10px">ჯერ გამარჯვებული არ არის</div>';return;} box.innerHTML=winners.slice().reverse().map(w=>'<div class="history-item"><b>'+escapeHtml(w.name)+'</b><span>'+escapeHtml(w.prize||'პრიზი')+'</span></div>').join(''); }
    $('loadBtn').addEventListener('click', loadAll); $('spinBtn').addEventListener('click', spin); $('clearScreenBtn').addEventListener('click', clearScreen); $('manualPrize').addEventListener('input',()=>syncPrizeInputs('manual')); $('prizeSelect').addEventListener('change',()=>syncPrizeInputs('select')); renderHistory(); updateStats(); renderReel([{first_name:'მონაწილეები',last_name:'იტრიალებს',ticket_id:'FARMASI 2026'}]);
  </script>
</body>
</html>
